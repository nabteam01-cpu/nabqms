<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時雲端排隊叫號系統</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .pulse-number { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, doc, getDoc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const { useState, useEffect, useCallback, useRef } = React;

        const DEFAULT_STATE = {
            currentNumber: 0,
            waitingList: [],
            lastIssued: 0,
            timePerPerson: 5,
            maxLimit: 100,
            userTickets: {} 
        };

        let app, auth, db;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'queue-system-app';

        try {
            let firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
            
            if (!firebaseConfig) {
                firebaseConfig = {
                    apiKey: "AIzaSyBmsDrnT8UqXqXXF4iEEjQK3hrL5edLpLo",
                    authDomain: "nabqms.firebaseapp.com",
                    projectId: "nabqms",
                    storageBucket: "nabqms.firebasestorage.app",
                    messagingSenderId: "224756645160",
                    appId: "1:224756645160:web:f08122d8c9334ff6fce41d",
                    measurementId: "G-YR8P3QJ7BW"
                };
            }

            if (firebaseConfig) {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
            }
        } catch(e) {
            console.error("雲端連線初始化失敗:", e);
        }

        const playBeepSound = (type = 'ding') => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'ding') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.6);
                } else if (type === 'alert') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    osc.frequency.setValueAtTime(660, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.4, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.5);
                }
            } catch(e) {
                console.log("音效播放受阻:", e);
            }
        };

        function useQueueData() {
            const [data, setData] = useState(DEFAULT_STATE);
            const [user, setUser] = useState(null);
            const [isOffline, setIsOffline] = useState(false);

            useEffect(() => {
                if (!auth) {
                    setIsOffline(true);
                    return;
                }
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch(e) { 
                        console.error("驗證失敗", e);
                        setIsOffline(true);
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!db || !user || isOffline) return;
                
                const docRef = doc(db, 'artifacts', appId, 'data', 'queue_state');
                const unsubscribe = onSnapshot(docRef, (snapshot) => {
                    if (snapshot.exists()) {
                        setData({ ...DEFAULT_STATE, ...snapshot.data() });
                    } else {
                        setDoc(docRef, DEFAULT_STATE).catch(e => {
                            console.warn("寫入權限不足，降級為單機模式", e);
                            setIsOffline(true);
                        });
                    }
                }, (error) => {
                    console.error("即時監聽中斷", error);
                    setIsOffline(true);
                });

                return () => unsubscribe();
            }, [user, isOffline]);

            const updateData = useCallback(async (updater) => {
                if (isOffline || !db || !user) {
                    setData(prev => {
                        const nextState = typeof updater === 'function' ? updater(prev) : updater;
                        return nextState;
                    });
                    return;
                }
                
                const docRef = doc(db, 'artifacts', appId, 'data', 'queue_state');
                try {
                    const snap = await getDoc(docRef);
                    const latestState = snap.exists() ? { ...DEFAULT_STATE, ...snap.data() } : DEFAULT_STATE;
                    const nextState = typeof updater === 'function' ? updater(latestState) : updater;
                    await setDoc(docRef, nextState);
                } catch (e) {
                    console.error("資料上傳失敗", e);
                    setIsOffline(true);
                }
            }, [user, isOffline]);

            return [data, updateData, isOffline, user];
        }

        const UsersIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        );
        const BellIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        );
        const ClockIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        );

        function PublicView({ data, updateData, user }) {
            const userId = user ? user.uid : 'guest';
            const prevCurrentNumRef = useRef(data.currentNumber);

            // 取得目前使用者的號碼（優先讀取雲端對應，次要讀取本機快取）
            const [localMyNumber, setLocalMyNumber] = useState(() => {
                try {
                    const saved = localStorage.getItem('my_queue_number');
                    return saved ? parseInt(saved, 10) : null;
                } catch(e) { return null; }
            });

            // 雲端與本機號碼整合判斷
            const cloudAssigned = (data.userTickets && data.userTickets[userId]) ? data.userTickets[userId] : null;
            const myNumber = cloudAssigned !== null ? cloudAssigned : localMyNumber;

            // 偵測是否被後台重置：當雲端 lastIssued 變回 0，強制清空本地記憶
            useEffect(() => {
                if (data.lastIssued === 0 && myNumber !== null) {
                    setLocalMyNumber(null);
                    try { localStorage.removeItem('my_queue_number'); } catch(e) {}
                }
            }, [data.lastIssued, myNumber]);

            const isPassed = myNumber !== null && data.currentNumber > myNumber;
            const isMyTurn = myNumber !== null && data.currentNumber === myNumber;

            useEffect(() => {
                if (isMyTurn && prevCurrentNumRef.current !== data.currentNumber) {
                    playBeepSound('ding');
                }
                prevCurrentNumRef.current = data.currentNumber;
            }, [isMyTurn, data.currentNumber]);

            const handleJoinQueue = async () => {
                if (myNumber !== null && !isPassed) return;

                playBeepSound('alert');
                await updateData(prev => {
                    const currentTickets = prev.userTickets || {};
                    // 如果雲端已有紀錄且未過號，不重複發號
                    if (currentTickets[userId] && prev.currentNumber <= currentTickets[userId]) {
                        return prev;
                    }

                    if (prev.maxLimit > 0 && prev.lastIssued >= prev.maxLimit) {
                        return prev;
                    }

                    const assignedNumber = prev.lastIssued + 1;
                    const updatedTickets = { ...currentTickets, [userId]: assignedNumber };
                    
                    try { localStorage.setItem('my_queue_number', assignedNumber); } catch(e) {}
                    setLocalMyNumber(assignedNumber);

                    return {
                        ...prev,
                        lastIssued: assignedNumber,
                        waitingList: [...prev.waitingList, assignedNumber],
                        userTickets: updatedTickets
                    };
                });
            };

            const canTakeTicket = myNumber === null || isPassed;
            const peopleAhead = myNumber && !isPassed ? Math.max(0, myNumber - data.currentNumber - 1) : 0;
            const isFull = data.maxLimit > 0 && data.lastIssued >= data.maxLimit;

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4 fade-in bg-gray-50">
                    <div className="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
                        <div className="bg-blue-600 text-white p-6 text-center">
                            <h2 className="text-2xl font-bold">即時雲端排隊叫號系統</h2>
                            <p className="text-blue-100 mt-1 text-sm">每支手機僅限領取一個有效號碼</p>
                        </div>
                        
                        <div className="p-8 text-center">
                            <p className="text-gray-500 text-lg mb-2 font-medium">目前服務號碼</p>
                            <div className="text-7xl font-extrabold text-blue-600 mb-6 pulse-number">
                                {data.currentNumber === 0 ? '--' : data.currentNumber}
                            </div>

                            {canTakeTicket && !isFull && (
                                <button 
                                    onClick={handleJoinQueue}
                                    className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-full shadow-lg transition transform hover:scale-105"
                                >
                                    {isPassed ? "重新取號排隊" : "取號排隊"}
                                </button>
                            )}

                            {canTakeTicket && isFull && (
                                <div className="bg-amber-50 border border-amber-200 text-amber-700 p-4 rounded-xl font-bold">
                                    今日取號已額滿
                                </div>
                            )}

                            {myNumber !== null && !canTakeTicket && (
                                <div className="mt-8 p-6 bg-gray-50 rounded-xl border border-gray-200 shadow-inner">
                                    <p className="text-gray-600 mb-1 font-medium">您的號碼是</p>
                                    <p className="text-6xl font-black text-gray-800 mb-6">{myNumber}</p>
                                    
                                    {isMyTurn ? (
                                        <div className="bg-green-100 text-green-700 p-4 rounded-xl flex items-center justify-center space-x-2 animate-bounce border border-green-200">
                                            <BellIcon />
                                            <span className="font-bold text-lg">輪到您了！請在5分鐘內前往櫃檯</span>
                                        </div>
                                    ) : (
                                        <div className="flex flex-col space-y-3">
                                            <div className="flex items-center justify-between text-gray-600 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                                <div className="flex items-center space-x-2">
                                                    <UsersIcon />
                                                    <span className="font-medium">前面還有</span>
                                                </div>
                                                <span className="font-bold text-2xl text-blue-600">{peopleAhead} <span className="text-sm font-normal text-gray-500">人</span></span>
                                            </div>
                                            
                                            <div className="flex items-center justify-between text-gray-600 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                                <div className="flex items-center space-x-2">
                                                    <ClockIcon />
                                                    <span className="font-medium">預估等候</span>
                                                </div>
                                                <span className="font-bold text-2xl text-orange-500">
                                                    {(peopleAhead + 1) * (data.timePerPerson || 5)} <span className="text-sm font-normal text-gray-500">分鐘</span>
                                                </span>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {isPassed && (
                                <div className="mt-4 bg-red-50 text-red-700 p-3 rounded-xl border border-red-100 text-sm font-bold">
                                    您的上一個號碼 ({myNumber}) 已過號，現可點擊上方按鈕重新取號。
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function AdminView({ data, updateData, setCurrentView }) {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [password, setPassword] = useState('');
            const [loginError, setLoginError] = useState('');
            const [showResetConfirm, setShowResetConfirm] = useState(false);
            const [resetPassword, setResetPassword] = useState('');
            const [resetError, setResetError] = useState('');

            const ADMIN_PASSWORD = '8888';

            const handleLogin = (e) => {
                e.preventDefault();
                if (password === ADMIN_PASSWORD) {
                    setIsAuthenticated(true);
                    setLoginError('');
                } else {
                    setLoginError('密碼錯誤，請重新輸入');
                }
            };

            const callNext = async () => {
                playBeepSound('ding');
                await updateData(prev => {
                    if (prev.waitingList.length === 0) return prev;
                    const nextNumber = prev.waitingList[0];
                    const newWaitingList = prev.waitingList.slice(1);
                    return {
                        ...prev,
                        currentNumber: nextNumber,
                        waitingList: newWaitingList
                    };
                });
            };

            const handleResetConfirm = async () => {
                if (resetPassword === ADMIN_PASSWORD) {
                    // 重置時連同本機暫存清除指令發出
                    try { localStorage.removeItem('my_queue_number'); } catch(e) {}
                    await updateData(DEFAULT_STATE);
                    setShowResetConfirm(false);
                    setResetPassword('');
                    setResetError('');
                } else {
                    setResetError('密碼錯誤，無法重置');
                }
            };

            const handleTimeChange = (e) => {
                const newTime = parseInt(e.target.value, 10);
                if (!isNaN(newTime) && newTime >= 1) {
                    updateData(prev => ({ ...prev, timePerPerson: newTime }));
                }
            };

            const handleMaxLimitChange = (e) => {
                const newLimit = parseInt(e.target.value, 10);
                if (!isNaN(newLimit) && newLimit >= 0) {
                    updateData(prev => ({ ...prev, maxLimit: newLimit }));
                }
            };

            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-gray-800 fade-in">
                        <div className="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm">
                            <h2 className="text-2xl font-bold text-center mb-6 text-gray-800">系統管理員登入</h2>
                            <form onSubmit={handleLogin}>
                                <div className="mb-6">
                                    <label className="block text-gray-700 text-sm font-bold mb-2">管理密碼</label>
                                    <input 
                                        type="password" 
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        className="shadow-sm appearance-none border border-gray-300 rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        placeholder="請輸入密碼"
                                    />
                                    {loginError && <p className="text-red-500 text-sm mt-2 font-medium">{loginError}</p>}
                                </div>
                                <button type="submit" className="w-full bg-gray-900 hover:bg-black text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-900 transition">
                                    登入控制台
                                </button>
                            </form>
                            <div className="mt-6 text-center">
                                <button onClick={() => setCurrentView('public')} className="text-sm text-gray-500 hover:text-gray-800 transition">返回民眾畫面</button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-100 p-6 fade-in">
                    <div className="max-w-4xl mx-auto">
                        <div className="flex justify-between items-center mb-8">
                            <h1 className="text-3xl font-bold text-gray-800">叫號控制台</h1>
                            <div className="space-x-4 flex items-center">
                                <button onClick={() => setCurrentView('public')} className="text-gray-600 hover:text-gray-900 font-medium px-4 py-2 border border-transparent rounded-lg hover:bg-gray-200 transition">
                                    返回民眾畫面
                                </button>
                                <button onClick={() => setShowResetConfirm(true)} className="text-red-600 hover:text-red-800 font-bold px-4 py-2 border-2 border-red-200 rounded-lg bg-white hover:bg-red-50 transition shadow-sm">
                                    重置系統
                                </button>
                            </div>
                        </div>

                        {showResetConfirm && (
                            <div className="mb-6 p-6 bg-red-50 border-2 border-red-200 rounded-xl shadow-sm fade-in">
                                <h3 className="text-red-700 font-bold text-lg mb-2 flex items-center">
                                    <span className="mr-2">⚠</span> 危險操作：重置系統
                                </h3>
                                <p className="text-red-600 mb-4 font-medium">確定要重置系統嗎？所有排隊資料將被清除且無法復原。請輸入管理員密碼以確認：</p>
                                <div className="flex flex-col sm:flex-row items-start sm:items-center space-y-3 sm:space-y-0 sm:space-x-3">
                                    <input 
                                        type="password" 
                                        value={resetPassword}
                                        onChange={(e) => setResetPassword(e.target.value)}
                                        placeholder="請輸入管理密碼"
                                        className="border-2 border-red-300 rounded-lg py-2 px-3 focus:outline-none focus:border-red-500 w-full sm:w-auto"
                                    />
                                    <div className="flex space-x-3 w-full sm:w-auto">
                                        <button onClick={() => setShowResetConfirm(false)} className="px-4 py-2 bg-white border border-gray-300 text-gray-700 font-medium rounded-lg hover:bg-gray-50 transition flex-1 sm:flex-none">取消</button>
                                        <button onClick={handleResetConfirm} className="px-4 py-2 bg-red-600 text-white font-bold rounded-lg hover:bg-red-700 transition shadow flex-1 sm:flex-none">確認重置</button>
                                    </div>
                                </div>
                                {resetError && <p className="text-red-600 text-sm mt-3 font-bold">{resetError}</p>}
                            </div>
                        )}

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                            <div className="bg-white rounded-2xl shadow-sm p-6 border border-gray-200 flex flex-col justify-between">
                                <div className="mb-4">
                                    <h2 className="text-lg font-bold text-gray-800">等候時間設定</h2>
                                    <p className="text-sm text-gray-500">民眾端預估等候時間計算基準</p>
                                </div>
                                <div className="flex items-center space-x-3 bg-gray-50 p-3 rounded-xl border border-gray-200">
                                    <span className="text-gray-700 font-medium">每人平均</span>
                                    <input 
                                        type="number" 
                                        min="1" 
                                        value={data.timePerPerson || 5} 
                                        onChange={handleTimeChange}
                                        className="border border-gray-300 rounded-lg w-20 py-2 px-2 text-center focus:outline-none focus:ring-2 focus:ring-blue-500 font-bold text-lg"
                                    />
                                    <span className="text-gray-700 font-medium">分鐘</span>
                                </div>
                            </div>

                            <div className="bg-white rounded-2xl shadow-sm p-6 border border-gray-200 flex flex-col justify-between">
                                <div className="mb-4">
                                    <h2 className="text-lg font-bold text-gray-800">取號上限設定</h2>
                                    <p className="text-sm text-gray-500">設定總共最多發放幾號 (設 0 為無限制)</p>
                                </div>
                                <div className="flex items-center space-x-3 bg-gray-50 p-3 rounded-xl border border-gray-200">
                                    <span className="text-gray-700 font-medium">最多發放</span>
                                    <input 
                                        type="number" 
                                        min="0" 
                                        value={data.maxLimit !== undefined ? data.maxLimit : 100} 
                                        onChange={handleMaxLimitChange}
                                        className="border border-gray-300 rounded-lg w-20 py-2 px-2 text-center focus:outline-none focus:ring-2 focus:ring-blue-500 font-bold text-lg"
                                    />
                                    <span className="text-gray-700 font-medium">號</span>
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div className="bg-white rounded-2xl shadow-sm p-8 border border-gray-200 flex flex-col justify-center">
                                <h2 className="text-xl font-bold text-gray-500 mb-2 text-center">目前正在服務</h2>
                                <div className="text-9xl font-black text-center text-blue-600 mb-8 tracking-tighter">
                                    {data.currentNumber === 0 ? '--' : data.currentNumber}
                                </div>
                                <button 
                                    onClick={callNext}
                                    disabled={data.waitingList.length === 0}
                                    className={`w-full py-5 rounded-2xl text-2xl font-bold text-white shadow-xl transition-all ${
                                        data.waitingList.length === 0 
                                        ? 'bg-gray-300 cursor-not-allowed shadow-none' 
                                        : 'bg-green-500 hover:bg-green-600 transform hover:-translate-y-1 active:translate-y-0'
                                    }`}
                                >
                                    呼叫下一位
                                </button>
                            </div>

                            <div className="bg-white rounded-2xl shadow-sm p-8 border border-gray-200 flex flex-col">
                                <div className="flex justify-between items-center mb-6 pb-4 border-b border-gray-100">
                                    <h2 className="text-xl font-bold text-gray-800">現場等候名單</h2>
                                    <span className="bg-blue-100 text-blue-800 text-sm font-bold px-4 py-1.5 rounded-full">
                                        共 {data.waitingList.length} 人
                                    </span>
                                </div>
                                
                                <div className="flex-1 overflow-y-auto max-h-[350px] pr-2 custom-scrollbar">
                                    {data.waitingList.length === 0 ? (
                                        <div className="h-full flex flex-col items-center justify-center text-gray-400 py-10">
                                            <p className="font-medium">目前無人等候</p>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-3 gap-4">
                                            {data.waitingList.map((num, idx) => (
                                                <div key={num} className="bg-gray-50 border border-gray-200 rounded-xl p-4 text-center shadow-sm relative overflow-hidden">
                                                    <div className="absolute top-0 left-0 w-full h-1 bg-blue-500 opacity-20"></div>
                                                    <span className="text-xs font-semibold text-gray-400 block mb-1 uppercase tracking-wider">順位 {idx + 1}</span>
                                                    <span className="text-3xl font-black text-gray-800">{num}</span>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [currentView, setCurrentView] = useState('public');
            const [data, updateData, isOffline, user] = useQueueData();

            let content;
            switch (currentView) {
                case 'admin':
                    content = <AdminView data={data} updateData={updateData} setCurrentView={setCurrentView} />;
                    break;
                case 'public':
                default:
                    content = <PublicView data={data} updateData={updateData} user={user} />;
            }

    return (
        <div className="antialiased text-gray-900 min-h-screen flex flex-col">
            <nav className="bg-white shadow-sm px-6 py-4 flex justify-between items-center z-10 sticky top-0">
                <div className="font-bold text-gray-800 flex items-center space-x-2 select-none">
                    <span className="bg-blue-600 text-white w-8 h-8 flex items-center justify-center rounded-lg shadow-sm">Q</span>
                    <span className="text-lg tracking-tight">排隊系統</span>
                    {isOffline && <span className="ml-2 text-[10px] bg-amber-100 text-amber-700 px-2 py-0.5 rounded border border-amber-200 font-normal">設備未連線</span>}
                </div>
                
                <div className="flex items-center space-x-3">
                    {currentView === 'admin' ? (
                        <span className="text-xs font-medium text-white bg-green-500 px-3 py-1.5 rounded-full shadow-sm">管理員模式</span>
                    ) : (
                        <button 
                            onClick={() => setCurrentView('admin')}
                            className="text-xs font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 hover:text-gray-900 px-3.5 py-2 rounded-lg transition cursor-pointer border border-gray-200 shadow-sm flex items-center space-x-1"
                        >
                            <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                            <span>管理員登入</span>
                        </button>
                    )}
                </div>
            </nav>
            <main className="flex-grow">
                {content}
            </main>
        </div>
    );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
